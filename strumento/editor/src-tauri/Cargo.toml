[package]
name = "interactivewriter-editor"
version = "0.1.0"
description = "InteractiveWriter — Editor GUI"
authors = ["Simone"]
edition = "2021"

[lib]
name = "interactivewriter_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
